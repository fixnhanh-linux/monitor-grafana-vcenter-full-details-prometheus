                - version
              error_handler: DISCARD_VALUE
            -
              type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          master_item:
            key: esxi.exporter.metrics
          tags:
            -
              tag: component
              value: exporter
