zabbix_export:
  version: '6.2'
  date: '2026-10-30T18:43:22Z'
  template_groups:
    -
      uuid: 34eb7516ed4043e980e4010c8cf2bb07
      name: Templates/Virtualization
  templates:
    -
      uuid: a27f32e83ec24bc499a022d68dfc9a3f
      template: 'ESXi Host Exporter by HTTP'
      name: 'ESXi & vSAN Command Center'
      description: |
        ESXi host + vSAN monitoring via esxi_host_exporter (/metrics). Level 2 = High, Level 3 = Warning.
        Link this template to a Zabbix host that represents the exporter machine; change macro {$ESXI.EXPORTER.URL} if the port is not 9811.
      groups:
        -
          name: Templates/Virtualization
      items:
        -
          uuid: 4c1de388b0ed485fa43a9d525e17a97f
          name: 'Exporter: Last Successful Collection'
          type: DEPENDENT
          key: esxi.exporter.last_success
          delay: '0'
          history: 7d
          trends: 90d
          value_type: FLOAT
          units: unixtime
          preprocessing:
            -
              type: PROMETHEUS_PATTERN
              parameters:
                - vsan_disk_exporter_last_success_timestamp_seconds
                - value
                - ''
              error_handler: DISCARD_VALUE
          master_item:
            key: esxi.exporter.metrics
          tags:
            -
              tag: component
              value: exporter
          triggers:
            -
              uuid: a89bb25ed9a149b1ad79a279d459c827
              expression: 'now()-last(/ESXi Host Exporter by HTTP/esxi.exporter.last_success)>{$ESXI.STALE}'
              name: 'Exporter Has No vCenter Data For > {$ESXI.STALE}s'
              priority: WARNING
              tags:
                -
                  tag: level
                  value: '3'
            -
              uuid: dea7831a49764fafae3f5bc78dea8cb3
              expression: 'now()-last(/ESXi Host Exporter by HTTP/esxi.exporter.last_success)>{$ESXI.STALE}'
              name: 'Exporter Has No vCenter Data For > {$ESXI.STALE}s (Level 3)'
              priority: WARNING
              tags:
                -
                  tag: level
                  value: '3'
        -
          uuid: 33005b871527442d82bdc4110794ae08
          name: 'Exporter: Metrics'
          type: HTTP_AGENT
          key: esxi.exporter.metrics
          history: '0'
          trends: '0'
          value_type: TEXT
          description: 'Fetches all esxi_host_exporter metrics; other items are extracted from this one.'
          timeout: 15s
          url: '{$ESXI.EXPORTER.URL}'
          tags:
            -
              tag: component
              value: exporter
        -
          uuid: e9cbf1dc36aa490cba45b031714a9563
          name: 'Exporter: vCenter Collection Status'
          type: DEPENDENT
          key: esxi.exporter.up
          delay: '0'
          history: 7d
          trends: 90d
          valuemap:
            name: 'Yes / No'
          preprocessing:
            -
              type: PROMETHEUS_PATTERN
              parameters:
                - vsan_disk_exporter_up
                - value
                - ''
              error_handler: DISCARD_VALUE
          master_item:
            key: esxi.exporter.metrics
          tags:
            -
              tag: component
              value: exporter
          triggers:
            -
              uuid: 2497599aeef4425cbab551cc2f643ee4
              expression: 'nodata(/ESXi Host Exporter by HTTP/esxi.exporter.up,5m)=1'
              name: 'Exporter Metrics Unavailable For 5 Min'
              priority: WARNING
              description: 'Exporter is stopped, wrong IP/port in macro {$ESXI.EXPORTER.URL}, or blocked by firewall.'
              tags:
                -
                  tag: level
                  value: '3'
            -
              uuid: fc4720abf4984b978ded44c7be954488
              expression: 'nodata(/ESXi Host Exporter by HTTP/esxi.exporter.up,5m)=1'
              name: 'Exporter Metrics Unavailable For 5 Min (Level 3)'
              priority: WARNING
              description: 'Exporter is stopped, wrong IP/port in macro {$ESXI.EXPORTER.URL}, or blocked by firewall.'
              tags:
                -
                  tag: level
                  value: '3'
        -
          uuid: e851c7eaa7824c85a43abd584561eac6
          name: 'Exporter: Version'
          type: DEPENDENT
          key: esxi.exporter.version
          delay: '0'
          history: 7d
          trends: '0'
          value_type: CHAR
          preprocessing:
            -
              type: PROMETHEUS_PATTERN
              parameters:
