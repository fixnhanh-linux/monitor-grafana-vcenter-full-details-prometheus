      discovery_rules:
        -
          uuid: bb7941a10eb3460ebe30ced34582f790
          name: 'vSAN Cluster Discovery'
          type: DEPENDENT
          key: esxi.cluster.discovery
          delay: '0'
          filter:
            evaltype: AND
            conditions:
              -
                macro: '{#CLUSTER}'
                value: '{$ESXI.CLUSTER.MATCHES}'
                formulaid: A
              -
                macro: '{#CLUSTER}'
                value: '{$ESXI.CLUSTER.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
                formulaid: B
          lifetime: 7d
          description: 'Discovered from exporter metric esxi_vsan_resync_objects.'
          item_prototypes:
            -
              uuid: 795a20abab154dffac9b7753b51148e6
              name: '[{#CLUSTER}] vSAN Resync Remaining'
              type: DEPENDENT
              key: 'esxi.resync.bytes["{#CLUSTER}"]'
              delay: '0'
              history: 7d
              trends: 90d
              units: B
              preprocessing:
                -
                  type: PROMETHEUS_PATTERN
                  parameters:
                    - 'esxi_vsan_resync_bytes{cluster="{#CLUSTER}"}'
                    - value
                    - ''
                  error_handler: DISCARD_VALUE
              master_item:
                key: esxi.exporter.metrics
              tags:
                -
                  tag: component
                  value: vsan
            -
              uuid: e8e5457be8d2405399620ad7d6bf89d3
              name: '[{#CLUSTER}] vSAN Resync Objects'
              type: DEPENDENT
              key: 'esxi.resync.objects["{#CLUSTER}"]'
              delay: '0'
              history: 7d
              trends: 90d
              preprocessing:
