<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="720" viewBox="0 0 1200 720" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">
  <style>
    .f{fill:none;stroke-width:2;stroke-dasharray:9 7;animation:run 0.9s linear infinite}
    .o{stroke-dasharray:4 6}
    @keyframes run{to{stroke-dashoffset:-16}}
    @media (prefers-reduced-motion: reduce){.f{animation:none}}
    .t{font-weight:700;font-size:13px}
    .s{fill:#666;font-size:10.5px}
    text{fill:#2a2a2a}
  </style>
  <defs>
    <marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f6db5"/></marker>
    <marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b47"/></marker>
    <marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d2541f"/></marker>
    <marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0334d"/></marker>
    <marker id="mx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#888"/></marker>
  </defs>
  <rect width="1200" height="720" fill="#ffffff"/>
  <text x="600" y="34" text-anchor="middle" style="font-size:19px;font-weight:700">Monitor Resource Host ESXi + vSAN — luồng dữ liệu chi tiết</text>
  <text x="600" y="54" text-anchor="middle" class="s">Mũi tên chạy theo hướng dữ liệu · mỗi vCenter = 1 instance exporter = 1 port (9811, 9812 …)</text>

  <!-- ===== vCenter ===== -->
  <rect x="20" y="70" width="250" height="560" rx="12" fill="#f3f7fc" stroke="#2f6db5" stroke-width="1.5"/>
  <text x="145" y="90" text-anchor="middle" class="t" style="fill:#1d4f8a">vCenter</text>
  <text x="145" y="104" text-anchor="middle" class="s">HTTPS 443 · tài khoản Read-only</text>
  <g fill="#ffffff" stroke="#8fb3de">
    <rect x="35" y="110" width="220" height="88" rx="8"/>
    <rect x="35" y="212" width="220" height="88" rx="8"/>
    <rect x="35" y="314" width="220" height="88" rx="8"/>
    <rect x="35" y="416" width="220" height="88" rx="8"/>
    <rect x="35" y="518" width="220" height="88" rx="8"/>
  </g>
  <text x="47" y="132" class="t" style="font-size:12px;fill:#1d4f8a">① vSphere API · PropertyCollector</text>
  <text x="47" y="152">kết nối, maintenance, uptime</text>
  <text x="47" y="170">CPU, RAM, số VM</text>
  <text x="47" y="188">vmnic: link, tốc độ (chỉ ≥10Gb)</text>
  <text x="47" y="234" class="t" style="font-size:12px;fill:#1d4f8a">② QueryPerf realtime (20s)</text>
  <text x="47" y="254">vmnic Tx / Rx (Mb/s)</text>
  <text x="47" y="272">vmk vSAN: drop / discard %</text>
  <text x="47" y="336" class="t" style="font-size:12px;fill:#1d4f8a">③ vSAN Performance</text>
  <text x="47" y="356">write / read latency (ms)</text>
  <text x="47" y="374">congestion host</text>
  <text x="47" y="438" class="t" style="font-size:12px;fill:#1d4f8a">④ vSAN Object System</text>
  <text x="47" y="458">resync: số object, bytes</text>
  <text x="47" y="476">còn lại theo cluster</text>
  <text x="47" y="540" class="t" style="font-size:12px;fill:#1d4f8a">⑤ vSAN Health</text>
  <text x="47" y="560">health từng disk (green/yellow/red)</text>
  <text x="47" y="578">disk group, overall cluster</text>

  <!-- ===== Server ===== -->
  <rect x="320" y="70" width="340" height="560" rx="12" fill="#f7f7f7" stroke="#888" stroke-dasharray="6 4"/>
  <text x="490" y="90" text-anchor="middle" class="t">Server Linux · systemd</text>
  <text x="490" y="104" text-anchor="middle" class="s">esxi-host-exporter@&lt;instance&gt; · user esxi-exporter</text>

  <rect x="335" y="110" width="130" height="394" rx="8" fill="#eaf7ec" stroke="#2e8b47" stroke-width="1.5"/>
  <text x="400" y="128" text-anchor="middle" class="t" style="font-size:12px;fill:#1f6b35">VÒNG NHANH</text>
  <text x="400" y="142" text-anchor="middle" class="s">mỗi 60 giây</text>
  <text x="343" y="168">host, CPU, RAM, NIC</text>
  <text x="343" y="270">Tx/Rx, drop vmk</text>
  <text x="343" y="372">latency, congestion</text>
  <text x="343" y="474">resync</text>

  <rect x="335" y="518" width="130" height="88" rx="8" fill="#eaf7ec" stroke="#2e8b47" stroke-width="1.5"/>
  <text x="400" y="540" text-anchor="middle" class="t" style="font-size:12px;fill:#1f6b35">VÒNG CHẬM</text>
  <text x="400" y="554" text-anchor="middle" class="s">mỗi 300 giây</text>
  <text x="343" y="576">health disk</text>
  <text x="343" y="594">disk group, số VM</text>

  <rect x="490" y="110" width="155" height="95" rx="8" fill="#fff8e1" stroke="#c99a00"/>
  <text x="500" y="130" class="t" style="font-size:12px;fill:#7a5d00">File .env (chmod 600)</text>
  <text x="500" y="150">vCenter, user, mật khẩu</text>
  <text x="500" y="168">ngưỡng ESXI_WARN_*</text>
  <text x="500" y="186">INFLUX_* (tuỳ chọn)</text>

  <rect x="490" y="235" width="155" height="120" rx="8" fill="#ffffff" stroke="#2e8b47" stroke-width="1.5"/>
  <text x="500" y="255" class="t" style="font-size:12px;fill:#1f6b35">Đánh giá status host</text>
  <text x="500" y="275" style="fill:#c0334d;font-weight:700">ERROR khi:</text>
  <text x="500" y="291">mất kết nối, vmnic down,</text>
  <text x="500" y="307">disk vSAN lỗi</text>
  <text x="500" y="327" style="fill:#b07800;font-weight:700">WARN: CPU&gt;60 RAM&gt;90</text>
  <text x="500" y="343">latency&gt;15ms, drop&gt;0,1%</text>

  <rect x="490" y="385" width="155" height="125" rx="8" fill="#ffffff" stroke="#d2541f" stroke-width="1.5"/>
  <text x="500" y="405" class="t" style="font-size:12px;fill:#a63c0e">HTTP :9811</text>
  <text x="500" y="427">/metrics</text>
  <text x="500" y="455">/  + /api/state</text>
  <text x="500" y="483">push InfluxDB</text>
  <text x="500" y="499" class="s">(nếu bật INFLUX_URL)</text>

  <rect x="490" y="540" width="155" height="66" rx="8" fill="#efe9fb" stroke="#6a4fc2"/>
  <text x="500" y="562" class="t" style="font-size:12px;fill:#4a3399">sudo esxi-menu</text>
  <text x="500" y="580">status · log · restart</text>
  <text x="500" y="596">cập nhật git / zip, sửa .env</text>

  <!-- ===== Cột 3 ===== -->
  <rect x="730" y="110" width="200" height="100" rx="8" fill="#f2f2f2" stroke="#888"/>
  <text x="742" y="130" class="t" style="font-size:12px">Cài đặt / cập nhật</text>
  <text x="742" y="148">git clone → deploy/install.sh</text>
  <text x="742" y="164">hoặc .zip + sha256sum -c</text>
  <text x="742" y="180">→ /opt/esxi-host-exporter</text>
  <text x="742" y="196">→ systemd + file .env</text>

  <rect x="730" y="330" width="200" height="110" rx="8" fill="#fdeee7" stroke="#d2541f" stroke-width="1.5"/>
  <text x="742" y="352" class="t" style="fill:#a63c0e">Prometheus</text>
  <text x="742" y="372">job esxi_host_resource</text>
  <text x="742" y="390">scrape 30s, lưu time-series</text>
  <text x="742" y="408">đánh giá 12 alert rule</text>
  <text x="742" y="428" class="s">prometheus/*.yml</text>

  <rect x="730" y="470" width="200" height="62" rx="8" fill="#eaf7ec" stroke="#2e8b47"/>
  <text x="742" y="494" class="t" style="font-size:12px;fill:#1f6b35">Dashboard web có sẵn</text>
  <text x="742" y="514">http://&lt;IP-server&gt;:9811/</text>

  <rect x="730" y="560" width="200" height="62" rx="8" fill="#f2f2f2" stroke="#777" stroke-dasharray="5 4"/>
  <text x="742" y="584" class="t" style="font-size:12px">InfluxDB (tuỳ chọn)</text>
  <text x="742" y="604">line protocol v1 / v2</text>

  <!-- ===== Cột 4 ===== -->
  <rect x="990" y="110" width="190" height="190" rx="8" fill="#fff2e0" stroke="#e08a00" stroke-width="1.5"/>
  <text x="1002" y="134" class="t" style="fill:#9a5e00">Grafana</text>
  <text x="1002" y="152" class="s">MONITOR RESOURCE HOST ESXi</text>
  <text x="1002" y="178">• Tổng quan OK / WARN / ERROR</text>
  <text x="1002" y="196">• Bảng host, NIC UP / DOWN</text>
  <text x="1002" y="214">• Network vmnic, drop vmk</text>
  <text x="1002" y="232">• vSAN disk, resync, latency</text>
  <text x="1002" y="250">• Chi tiết từng host</text>
  <text x="1002" y="284" class="s">grafana/*.json</text>

  <rect x="990" y="330" width="190" height="80" rx="8" fill="#fbe9ec" stroke="#c0334d" stroke-width="1.5"/>
  <text x="1002" y="354" class="t" style="fill:#8f1f34">Alertmanager</text>
  <text x="1002" y="374">route Esxi.* | Vsan.*</text>
  <text x="1002" y="392">critical / error / warning</text>

  <rect x="990" y="450" width="190" height="62" rx="8" fill="#efe9fb" stroke="#6a4fc2" stroke-width="1.5"/>
  <text x="1002" y="476" class="t" style="font-size:12px;fill:#4a3399">Element / Matrix</text>
  <text x="1002" y="496">nhóm trực nhận cảnh báo</text>

  <!-- ===== Mũi tên ===== -->
  <g class="f" stroke="#2f6db5" marker-end="url(#mb)">
    <path id="v1" d="M255,154 H332"/>
    <path id="v2" d="M255,256 H332"/>
    <path id="v3" d="M255,358 H332"/>
    <path id="v4" d="M255,460 H332"/>
    <path id="v5" d="M255,562 H332"/>
  </g>
  <g class="f" stroke="#2e8b47" marker-end="url(#mg)">
    <path id="g1" d="M465,295 H487"/>
    <path id="g2" d="M465,562 H477 V330 H487"/>
    <path id="g3" d="M567,355 V382"/>
    <path id="g4" d="M645,455 C690,455 690,500 727,500"/>
  </g>
  <g class="f o" stroke="#888" marker-end="url(#mx)">
    <path d="M567,205 V232"/>
    <path d="M728,160 H648"/>
    <path id="x1" d="M645,490 C690,490 690,590 727,590"/>
  </g>
  <g class="f" stroke="#d2541f" marker-end="url(#mo)">
    <path id="o1" d="M645,427 C690,427 690,395 727,395"/>
    <path id="o2" d="M830,330 V270 H987"/>
  </g>
  <g class="f" stroke="#c0334d" marker-end="url(#mr)">
    <path id="r1" d="M930,370 H987"/>
    <path id="r2" d="M1085,410 V447"/>
  </g>

  <!-- nhãn mũi tên -->
  <g class="s">
    <text x="576" y="224">ngưỡng</text>
    <text x="668" y="153">cài</text>
    <text x="672" y="394" style="fill:#a63c0e">scrape</text>
    <text x="838" y="295" style="fill:#a63c0e">PromQL</text>
    <text x="938" y="362" style="fill:#8f1f34">firing</text>
    <text x="1092" y="434" style="fill:#8f1f34">gửi tin</text>
  </g>

  <!-- chấm dữ liệu chạy -->
  <g>
    <circle r="4" fill="#2f6db5"><animateMotion dur="1.6s" repeatCount="indefinite"><mpath xlink:href="#v1"/></animateMotion></circle>
    <circle r="4" fill="#2f6db5"><animateMotion dur="1.6s" begin="0.3s" repeatCount="indefinite"><mpath xlink:href="#v2"/></animateMotion></circle>
    <circle r="4" fill="#2f6db5"><animateMotion dur="1.6s" begin="0.6s" repeatCount="indefinite"><mpath xlink:href="#v3"/></animateMotion></circle>
    <circle r="4" fill="#2f6db5"><animateMotion dur="1.6s" begin="0.9s" repeatCount="indefinite"><mpath xlink:href="#v4"/></animateMotion></circle>
    <circle r="4" fill="#2f6db5"><animateMotion dur="4s" repeatCount="indefinite"><mpath xlink:href="#v5"/></animateMotion></circle>
    <circle r="4" fill="#2e8b47"><animateMotion dur="3s" repeatCount="indefinite"><mpath xlink:href="#g2"/></animateMotion></circle>
    <circle r="4" fill="#2e8b47"><animateMotion dur="1.4s" repeatCount="indefinite"><mpath xlink:href="#g3"/></animateMotion></circle>
    <circle r="4" fill="#2e8b47"><animateMotion dur="2s" repeatCount="indefinite"><mpath xlink:href="#g4"/></animateMotion></circle>
    <circle r="4" fill="#d2541f"><animateMotion dur="1.8s" repeatCount="indefinite"><mpath xlink:href="#o1"/></animateMotion></circle>
    <circle r="4" fill="#d2541f"><animateMotion dur="2.4s" repeatCount="indefinite"><mpath xlink:href="#o2"/></animateMotion></circle>
    <circle r="4" fill="#c0334d"><animateMotion dur="1.4s" repeatCount="indefinite"><mpath xlink:href="#r1"/></animateMotion></circle>
    <circle r="4" fill="#c0334d"><animateMotion dur="1.4s" begin="0.7s" repeatCount="indefinite"><mpath xlink:href="#r2"/></animateMotion></circle>
    <circle r="3.5" fill="#888"><animateMotion dur="2.4s" repeatCount="indefinite"><mpath xlink:href="#x1"/></animateMotion></circle>
  </g>

  <!-- ===== Chú thích ===== -->
  <rect x="20" y="650" width="1160" height="52" rx="8" fill="#fafafa" stroke="#ddd"/>
  <g class="f">
    <path d="M40,676 H90" stroke="#2f6db5"/>
    <path d="M270,676 H320" stroke="#2e8b47"/>
    <path d="M500,676 H550" stroke="#d2541f"/>
    <path d="M720,676 H770" stroke="#c0334d"/>
    <path d="M920,676 H970" stroke="#888" class="f o"/>
  </g>
  <text x="98" y="680">vCenter → exporter (đọc API)</text>
  <text x="328" y="680">xử lý trong exporter / web</text>
  <text x="558" y="680">metrics → Prometheus → Grafana</text>
  <text x="778" y="680">cảnh báo</text>
  <text x="978" y="680">tuỳ chọn / cài đặt / cấu hình</text>
</svg>
